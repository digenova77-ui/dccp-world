<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DCCP World</title>
<style>
  :root { --bg:#07080c; --fg:#f3efe6; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); }
  body { font-family:system-ui, sans-serif; font-size:clamp(0.95rem, 2.4vw, 1.15rem); }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; }
  #shut, #stats {
    position:fixed; left:0.8rem; right:0.8rem; bottom:0.8rem;
    background:#07080ccc; border:1px solid #f3efe633; border-radius:0.6rem;
    padding:0.7rem 0.8rem; max-width:36rem;
  }
  #shut { top:1rem; bottom:auto; }
  #stats { pointer-events:none; }
  .row { display:flex; justify-content:space-between; gap:0.6rem; font-size:clamp(0.8rem, 2vw, 1rem); }
  .row span { overflow-wrap:anywhere; }
  h1 { font-size:clamp(1.1rem, 4vw, 1.4rem); font-weight:600; margin:0 0 0.4rem; }
</style>
</head>
<body>
<canvas id="world" aria-label="DCCP world"></canvas>
<div id="shut" hidden>
  <h1>World shut</h1>
  <p>This depth opens only from the HUD handoff. A browse is not an entry.</p>
</div>
<div id="stats" hidden></div>
<script type="module">
import { readHandoff } from "./src/entry.js";
import { formatFigure, formatDate } from "./src/format.js";
import { mountWorld } from "./src/world.js";

const shut = document.getElementById("shut");
const stats = document.getElementById("stats");
const handoff = readHandoff(sessionStorage);
if (!handoff) {
  shut.hidden = false;
} else {
  const world = mountWorld(document.getElementById("world"));
  const figures = await fetch("./src/data/figures.json").then((r) => r.json());
  stats.hidden = false;
  function paint() {
    const rows = figures.figures.map((f) =>
      `<div class="row"><span>${f.label}</span><span>${formatFigure(f.value)}</span></div>`
    ).join("");
    stats.innerHTML = `<div class="row"><span>Handoff</span><span>${formatDate(handoff.at)}</span></div>` + rows;
  }
  paint();
  if (!world.ok) stats.insertAdjacentHTML("beforeend", `<div class="row"><span>Renderer</span><span>${world.reason}</span></div>`);
}
</script>
</body>
</html>
