<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DCCP handoff harness</title>
</head>
<body>
<p>Verifier harness. This is not the world. It writes the HUD handoff record, then opens the world.</p>
<button id="open" type="button">Write handoff and open world</button>
<script type="module">
import { acceptHandoff } from "../src/entry.js";
document.getElementById("open").addEventListener("click", () => {
  acceptHandoff(sessionStorage, { accepted: true, at: new Date().toISOString() });
  location.assign("../index.html");
});
</script>
</body>
</html>
